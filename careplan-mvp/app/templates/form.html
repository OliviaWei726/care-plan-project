<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Care Plan Order</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; color: #222; }
    h1   { font-size: 1.4rem; margin-bottom: 4px; }
    .sub { color: #666; font-size: 0.9rem; margin-bottom: 28px; }
    .section { margin-bottom: 24px; }
    .section h2 { font-size: 1rem; border-bottom: 1px solid #ddd; padding-bottom: 4px; margin-bottom: 12px; }
    label  { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 4px; }
    input[type=text], textarea {
      width: 100%; box-sizing: border-box;
      border: 1px solid #ccc; border-radius: 4px;
      padding: 8px 10px; font-size: 0.9rem; margin-bottom: 14px;
    }
    textarea { resize: vertical; }
    .hint { font-size: 0.78rem; color: #888; margin-top: -10px; margin-bottom: 14px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    button {
      background: #1a56db; color: #fff; border: none;
      padding: 12px 32px; border-radius: 4px; font-size: 1rem;
      cursor: pointer; width: 100%;
    }
    button:hover { background: #1648c0; }
    .loading { display: none; text-align: center; margin-top: 12px; color: #555; }
    a { color: #1a56db; text-decoration: none; font-size: 0.85rem; }
  </style>
</head>
<body>

<h1>Care Plan Generator</h1>
<p class="sub">CVS Specialty Pharmacy &nbsp;·&nbsp; <a href="/orders/">View all orders →</a></p>

<form method="POST" action="/submit/" onsubmit="showLoading()">
  {% csrf_token %}

  <div class="section">
    <h2>Patient</h2>
    <div class="row">
      <div>
        <label>First Name</label>
        <input type="text" name="patient_first_name" required>
      </div>
      <div>
        <label>Last Name</label>
        <input type="text" name="patient_last_name" required>
      </div>
    </div>
    <label>MRN (6-digit)</label>
    <input type="text" name="patient_mrn" placeholder="e.g. 001234" required>
  </div>

  <div class="section">
    <h2>Provider</h2>
    <div class="row">
      <div>
        <label>Referring Provider Name</label>
        <input type="text" name="referring_provider" required>
      </div>
      <div>
        <label>Provider NPI (10-digit)</label>
        <input type="text" name="referring_provider_npi" placeholder="e.g. 1234567890" required>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>Order</h2>
    <label>Medication Name</label>
    <input type="text" name="medication_name" required>

    <label>Primary Diagnosis (ICD-10)</label>
    <input type="text" name="primary_diagnosis" placeholder="e.g. G70.01" required>

    <label>Additional Diagnoses (ICD-10)</label>
    <textarea name="additional_diagnoses" rows="3" placeholder="One code per line&#10;e.g. I10&#10;K21.0"></textarea>
    <p class="hint">One ICD-10 code per line. Leave blank if none.</p>

    <label>Medication History</label>
    <textarea name="medication_history" rows="4" placeholder="One entry per line&#10;e.g. Pyridostigmine 60 mg PO q6h&#10;Prednisone 10 mg PO daily"></textarea>
    <p class="hint">One medication per line.</p>
  </div>

  <div class="section">
    <h2>Patient Records / Clinical Notes</h2>
    <textarea name="patient_records" rows="10"
      placeholder="Paste clinical notes here — symptoms, history, labs, neurology recommendations, etc."></textarea>
  </div>

  <button type="submit">Generate Care Plan</button>
  <p class="loading" id="loading">⏳ Generating care plan — this may take 10–20 seconds…</p>

</form>

<script>
  function showLoading() {
    document.getElementById("loading").style.display = "block";
    document.querySelector("button").disabled = true;
    document.querySelector("button").textContent = "Generating…";
  }
</script>

</body>
</html>
