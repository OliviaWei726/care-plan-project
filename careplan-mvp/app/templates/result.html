<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Care Plan — {{ order.patient_first_name }} {{ order.patient_last_name }}</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; color: #222; }
    .header { border-bottom: 2px solid #1a56db; padding-bottom: 12px; margin-bottom: 24px; }
    .header h1 { font-size: 1.3rem; margin: 0 0 4px; }
    .meta { font-size: 0.85rem; color: #555; }
    .meta span { margin-right: 20px; }
    .care-plan {
      white-space: pre-wrap;
      font-size: 0.92rem;
      line-height: 1.7;
      background: #f9f9f9;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 20px 24px;
    }
    .actions { margin-top: 24px; display: flex; gap: 12px; }
    button, a.btn {
      padding: 10px 24px; border-radius: 4px; font-size: 0.9rem;
      cursor: pointer; text-decoration: none; display: inline-block;
    }
    .btn-primary { background: #1a56db; color: #fff; border: none; }
    .btn-primary:hover { background: #1648c0; }
    .btn-outline { background: #fff; color: #1a56db; border: 1px solid #1a56db; }
    .btn-outline:hover { background: #f0f4ff; }

    @media print {
      .actions { display: none; }
      body { margin: 0; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>Care Plan: {{ order.medication_name }}</h1>
  <div class="meta">
    <span><strong>Patient:</strong> {{ order.patient_first_name }} {{ order.patient_last_name }}</span>
    <span><strong>MRN:</strong> {{ order.patient_mrn }}</span>
    <span><strong>Dx:</strong> {{ order.primary_diagnosis }}</span>
    <span><strong>Provider:</strong> {{ order.referring_provider }}</span>
    <span><strong>Order ID:</strong> {{ order.id }}</span>
  </div>
</div>

<div class="care-plan">{{ order.care_plan }}</div>

<div class="actions">
  <button class="btn-primary" onclick="window.print()">🖨 Print Care Plan</button>
  <a class="btn-outline" href="/">＋ New Order</a>
  <a class="btn-outline" href="/orders/">All Orders</a>
</div>

</body>
</html>
