services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: careplan
      POSTGRES_USER: careplan
      POSTGRES_PASSWORD: careplan
    ports:
      - "5432:5432"       # 让 TablePlus 可以直接连
    volumes:
      - postgres_data:/var/lib/postgresql/data   # 数据持久化

  redis:
    image: redis:7
    ports:
      - "6379:6379"       # 本地可以用 redis-cli 直接连进来看队列

  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
