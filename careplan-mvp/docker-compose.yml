services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: careplan
      POSTGRES_USER: careplan
      POSTGRES_PASSWORD: careplan
    ports:
      - "5432:5432"       # 让 TablePlus 可以直接连
    volumes:
      - postgres_data:/var/lib/postgresql/data   # 数据持久化

  redis:
    image: redis:7
    ports:
      - "6379:6379"       # 本地可以用 redis-cli 直接连进来看队列

  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  # Celery worker：和 web 用同一个镜像、同一份代码，只是启动命令不同。
  # web 负责收请求、把任务放进 Redis；worker 负责从 Redis 取任务、调 LLM、写 DB。
  worker:
    build: .
    command: celery -A config worker -l info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
